<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Exam Guard Proctor</title>
  <style>
    :root {
      --bg: #0b1324;
      --card-bg: #131f38;
      --card-border: #1e2e4f;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --success: #10b981;
    }

    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .eg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .eg-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .eg-header-icon {
      font-size: 24px;
    }

    .eg-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .eg-version {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Current Tab Status */
    .eg-tab-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .eg-tab-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-status {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-active { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-inactive { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }
    .badge-danger { background: var(--danger-bg); color: #f87171; border: 1px solid #b91c1c; }

    /* Alert Banner for Terminated Students */
    #alert-box {
      display: none;
      background: #2a0b12;
      border: 1px solid var(--danger);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      animation: alertPulse 2s infinite ease-in-out;
    }

    @keyframes alertPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 10px 2px rgba(239, 68, 68, 0.3); }
    }

    .alert-header {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fca5a5;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .terminated-list {
      max-height: 120px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 12px;
    }

    .terminated-item {
      padding: 6px 8px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 6px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .terminated-item strong {
      color: #fca5a5;
    }

    .terminated-item span {
      color: #94a3b8;
      font-size: 11px;
    }

    /* Stats Grid */
    .eg-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .eg-stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }

    .eg-stat-val {
      font-size: 18px;
      font-weight: 800;
    }

    .eg-stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Action Buttons */
    .eg-btn {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
      transition: all 0.15s ease;
    }

    .eg-btn-primary {
      background: var(--primary);
      color: white;
    }
    .eg-btn-primary:hover {
      background: var(--primary-hover);
    }

    .eg-btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
    }
    .eg-btn-secondary:hover {
      background: #334155;
      color: white;
    }

    .eg-footer-links {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 11px;
    }

    .eg-link {
      color: #93c5fd;
      text-decoration: none;
      cursor: pointer;
    }
    .eg-link:hover {
      text-decoration: underline;
    }
    .eg-link-danger {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="eg-header">
    <div class="eg-header-left">
      <span class="eg-header-icon">🛡️</span>
      <div>
        <h2>Exam Guard</h2>
        <div class="eg-version">ระบบคุมสอบอัตโนมัติ v2.3</div>
      </div>
    </div>
  </div>

  <!-- Current Tab Detection -->
  <div class="eg-tab-box">
    <div class="eg-tab-row">
      <span style="color: var(--text-muted);">แท็บปัจจุบัน:</span>
      <span id="tab-status" class="badge-status badge-inactive">ตรวจสอบ...</span>
    </div>
    <div id="tab-student" style="margin-top: 6px; display: none; color: #cbd5e1;"></div>
    <div id="tab-timer" style="margin-top: 4px; display: none; color: #60a5fa; font-weight: 700; font-family: monospace;"></div>
  </div>

  <!-- Special Google Forms Detection Box -->
  <div id="gform-box" style="display: none; background: #2e1065; border: 1px solid #7c3aed; border-radius: 12px; padding: 12px; margin-bottom: 12px;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
      <span style="font-size:20px;">📝</span>
      <div>
        <strong style="color:#d8b4fe; font-size:13px;">ตรวจพบหน้า Google Forms</strong>
        <div style="color:#c4b5fd; font-size:11px;">เปิดแผงควบคุม Extended Form เพื่อตั้งค่าสอบ</div>
      </div>
    </div>
    <button id="btn-open-gform-sidebar" class="eg-btn" style="background:#7c3aed; color:#fff; font-size:13px; margin-bottom:6px; cursor:pointer;">
      🎛️ เปิดแผงควบคุม Extended Form บนหน้านี้
    </button>
    <button id="btn-open-dashboard" class="eg-btn eg-btn-secondary" style="font-size:12px; padding:8px; cursor:pointer;">
      🌐 เปิดหน้า Dashboard เต็มจอ
    </button>
  </div>

  <!-- Red Alert Box for Terminated Examinees -->
  <div id="alert-box">
    <div class="alert-header">
      <span>🚨</span>
      <span id="alert-title">พบผู้ทำผิดกฎเกินกำหนด!</span>
    </div>
    <ul class="terminated-list" id="terminated-list">
      <!-- Injected by popup.js -->
    </ul>
  </div>

  <!-- Overview Stats -->
  <div class="eg-stats-grid">
    <div class="eg-stat-card">
      <div class="eg-stat-val" id="stat-total" style="color: #60a5fa;">0</div>
      <div class="eg-stat-label">ผู้สอบทั้งหมด</div>
    </div>
    <div class="eg-stat-card">
      <div class="eg-stat-val" id="stat-active" style="color: #34d399;">0</div>
      <div class="eg-stat-label">กำลังสอบ</div>
    </div>
    <div class="eg-stat-card">
      <div class="eg-stat-val" id="stat-terminated" style="color: #f87171;">0</div>
      <div class="eg-stat-label">ระเมิดเกิน</div>
    </div>
  </div>

  <!-- Quick Actions -->
  <button id="btn-dashboard" class="eg-btn eg-btn-primary">
    📊 เปิดแดชบอร์ดผู้คุมสอบ (ดูประวัติ)
  </button>
  <button id="btn-settings" class="eg-btn eg-btn-secondary">
    ⚙️ ตั้งค่า URL ข้อสอบ & ความปลอดภัย
  </button>

  <div class="eg-footer-links">
    <a href="#" class="eg-link" id="link-refresh">🔄 รีเฟรชข้อมูล</a>
    <a href="#" class="eg-link eg-link-danger" id="link-reset">ล้างประวัติการสอบ</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
